<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Enquanto a raiz for só um aviso, não há o que indexar. Tirar o noindex quando o
     currículo entrar aqui. -->
<meta name="robots" content="noindex, nofollow">
<title>Giovanna Pimentel</title>
<style>
:root { --menta: #DCFEEE; --agua: #E4FAFF; --lilas-claro: #E3DDFF; --tinta: #0B0B0C; --tinta-suave: #3C3F45; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px;
  background: linear-gradient(140deg, var(--menta), var(--agua) 45%, var(--lilas-claro));
  color: var(--tinta);
  font: 400 18px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  text-align: center;
}
h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.02em; }
p { margin: 0; color: var(--tinta-suave); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body {
    background: linear-gradient(140deg, #0E1A18, #101A1E 45%, #16142A);
    color: #F2F3F5;
  }
  :root:not([data-theme="light"]) p { color: #C7CAD1; }
}
</style>
</head>
<body>
<main>
  <h1>Giovanna Pimentel</h1>
  <p>Site em construção.</p>
</main>
</body>
</html>
